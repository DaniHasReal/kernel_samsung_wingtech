name: Build Kernel Samsung Wingtech (a04)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrate KernelSU-Next 1.1.1
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.1.1

    - name: Apply SUSFS patches
      run: |
        # Clone susfs at a stable tag
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1
  
        # Copy KSU-side patch to your KSU-Next fork folder
        cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/

        # Copy kernel-side patch
        cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch .

        # Copy fs and include files
        cp susfs4ksu/kernel_patches/fs/* fs/
        cp susfs4ksu/kernel_patches/include/linux/* include/linux/

        # Apply KSU-side patch
        cd KernelSU-Next && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..

        # Apply kernel-side patch
        patch -p1 < 50_add_susfs_in_kernel-4.19.patch
   
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip \
          wget xz-utils device-tree-compiler libfdt-dev

    - name: Prepare directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC 4.9 toolchain
      run: |
        cd toolchain/gcc
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xf
        tar -xf gcc.tar.xf -C ./

    - name: Download Clang r383902
      run: |
        cd toolchain/clang
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Export environment variables
      run: |
        echo "CROSS_COMPILE=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CC=$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin/clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w" >> $GITHUB_ENV
        echo "LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        make -C $(pwd) O=$(pwd)/out \
          KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          rsuntk-a04_defconfig rsuntk.config

        make -C $(pwd) O=$(pwd)/out \
          KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          -j$(nproc)

    - name: Copy Image to source tree
      run: |
        cp out/arch/arm64/boot/Image arch/arm64/boot/Image || echo "Image not found!"

    - name: Archive output
      run: |
        cd out/arch/arm64/boot/
        zip -r9 kernel.zip Image dtb* dtbo* 2>/dev/null || true

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/kernel.zip
          .config
